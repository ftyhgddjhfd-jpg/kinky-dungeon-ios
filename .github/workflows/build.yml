name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen & CocoaPods
        run: |
          brew install xcodegen
          gem install cocoapods --no-document || sudo gem install cocoapods --no-document

      - name: Prepare game resources
        run: |
          echo "合并资源分卷..."
          cat www_parts/www.part_* > www.zip
          ls -lh www.zip
          mkdir -p KinkyDungeonApp/www
          unzip -q www.zip -d KinkyDungeonApp/www
          if [ -d "KinkyDungeonApp/www/html-classic.itch.zone" ]; then
            mv KinkyDungeonApp/www/html-classic.itch.zone/html/15253691-1557146/* KinkyDungeonApp/www/ 2>/dev/null || true
            rm -rf KinkyDungeonApp/www/html-classic.itch.zone
          fi
          ls KinkyDungeonApp/www | head -5
          du -sh KinkyDungeonApp/www

      - name: Generate project & install pods
        run: |
          xcodegen generate
          pod install

      - name: Build (no codesign)
        run: |
          xcodebuild -workspace KinkyDungeonApp.xcworkspace \
            -scheme KinkyDungeonApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/KinkyDungeonApp.app Payload/
          zip -qry KinkyDungeon.ipa Payload/
          ls -lh KinkyDungeon.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinkyDungeon-ipa
          path: KinkyDungeon.ipa
          retention-days: 14
